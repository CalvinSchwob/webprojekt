<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>image-container-demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f1ea;
      font-family: system-ui, sans-serif;
    }
    .stage {
      width: min(92vw, 560px);
      aspect-ratio: 560 / 640;
      position: relative;
    }
    .image-container {
      position: absolute;
      inset: 0;
      background: #c4b3e6;
      border-top-left-radius: 72px;
      border-bottom-left-radius: 72px;
      overflow: hidden;
    }
    .layer {
      position: absolute;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }
    .flower { width: 48%; left: 8%; top: 10%; }
    .rose { width: 30%; left: 42%; top: 28%; }
    .bean { width: 28%; left: 18%; top: 40%; transform: rotate(-18deg); }
    .raspberry { width: 34%; right: 10%; bottom: 16%; }
    .butterfly { width: 24%; right: 8%; bottom: 8%; transform: rotate(-14deg); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="image-container">
      <img class="layer flower" src="https://picsum.photos/seed/flower/600/600" alt="Blume">
      <img class="layer rose" src="https://picsum.photos/seed/rose/400/400" alt="Rose">
      <img class="layer bean" src="https://picsum.photos/seed/bean/400/300" alt="Kaffeebohne">
      <img class="layer raspberry" src="https://picsum.photos/seed/raspberry/500/500" alt="Himbeere">
      <img class="layer butterfly" src="https://picsum.photos/seed/butterfly/400/300" alt="Schmetterling">
    </div>
  </div>
</body>
</html>
